name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

      - name: Reject machine-specific or secret material
        shell: pwsh
        run: |
          $patterns = @('C:\\Users\\[^<]', 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY', 'sk-[A-Za-z0-9]{20,}')
          $files = Get-ChildItem -Recurse -File | Where-Object { $_.FullName -notmatch '\\.git\\' }
          foreach ($pattern in $patterns) {
            $matches = $files | Select-String -Pattern $pattern
            if ($matches) { $matches; exit 1 }
          }

      - name: Check six self-contained packages
        shell: pwsh
        run: |
          foreach ($lang in @('EN', 'TR')) {
            foreach ($platform in @('Windows', 'Linux', 'macOS')) {
              $base = Join-Path $lang $platform
              $engine = if ($platform -eq 'Windows') { 'ps1' } else { 'sh' }
              $launcher = if ($platform -eq 'Windows') { 'bat' } else { 'sh' }
              foreach ($file in @("setup-ai-context.$engine", "check-status.$engine", "INSTALL.$launcher", "CHECK_STATUS.$launcher", 'README.md', 'GUIDE.md', 'AGENT_PROMPT.md', 'SECURITY.md', 'LICENSE', 'cloud/setup.sh', 'cloud/maintenance.sh', 'cloud/query.sh')) {
                if (-not (Test-Path -LiteralPath (Join-Path $base $file))) { throw "Missing: $base/$file" }
              }
            }
          }

  unix-syntax:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse Bash scripts
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Verify Python requirement
        run: python3 -c 'import sys; assert sys.version_info >= (3, 10)'
      - name: Exercise repeatable Unix installation
        run: bash tests/unix-smoke.sh
